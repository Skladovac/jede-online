# /etc/nginx/sites-available/kasino.jede.online.conf
# Upstream 127.0.0.1:3100 = kontejner CVMS. Vlastník kontejneru: Codex.
# Dokud kontejner neběží, nginx tu vrací 502 — to je očekávaný stav.

server {
    listen 80;
    listen [::]:80;
    server_name kasino.jede.online;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    client_max_body_size 25m;   # CVMS nahrává fotky

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
