# /etc/nginx/sites-available/jede.online.conf
# nginx běží NA HOSTU (ne v kontejneru) a proxuje na 127.0.0.1 porty.
# TLS bloky dopíše `certbot --nginx` — tenhle soubor je stav PŘED certbotem.

server {
    listen 80;
    listen [::]:80;
    server_name jede.online www.jede.online;

    # Certbot webroot — musí být dostupné i po přidání TLS.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
