# /etc/nginx/sites-available/kasinovsetin.jede.online.conf
# Statické HTML, žádný kontejner. Obsah v /var/www/kasinovsetin.
#
# POZOR: casinovsetin.cz ani kasinovsetin.cz sem NEPATŘÍ — zůstávají na WEDOSu.

server {
    listen 80;
    listen [::]:80;
    server_name kasinovsetin.jede.online;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    root /var/www/kasinovsetin;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
}
