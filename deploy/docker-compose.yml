# jede.online — produkční compose na Hetzner CX23 (178.104.231.220)
#
# Soubor žije V REPU (landing/deploy/), ne volně na serveru — po `git reset --hard`
# se tak aktualizuje spolu s kódem a nemůže zůstat viset stará kopie.
# Spouští se vždy přes deploy-landing.sh, který doplní -f a --env-file.
#
# PRAVIDLO (pojistka 8): proměnná, která tu není VYPSANÁ, do kontejneru NEDOJDE,
# i kdyby byla v .env. Proto žádné `env_file` u aplikací — všechno explicitně.

name: jede

services:
  db:
    # Verze musí sedět s Neonem (17.11) — dump z 17 se do 16 neobnoví.
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # NIKDY 0.0.0.0 — databáze nesmí být vidět z internetu.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  landing:
    build:
      context: ..            # kořen repa jede-online (tam je Dockerfile)
      target: runner
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${LANDING_DATABASE_URL}
      DIRECT_URL: ${LANDING_DIRECT_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
    ports:
      - "127.0.0.1:3200:3000"

  # Migrační brána pro landing (pojistka 3). Sdílí build cache s `landing`,
  # jen se zastaví na stage `builder`, kde je prisma CLI i prisma/migrations/.
  # Spouští výhradně deploy-landing.sh.
  landing-migrate:
    build:
      context: ..
      target: builder
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${LANDING_DATABASE_URL}
      DIRECT_URL: ${LANDING_DIRECT_URL}
    command: ["npx", "prisma", "migrate", "status"]

  # ── CVMS (kasino.jede.online) ──────────────────────────────────────
  # Běží jako VLASTNÍ compose projekt z repa kasino (deploy/docker-compose.yml),
  # protože je to jiné repo s vlastním životním cyklem.
  # Kontrakt vůči téhle infrastruktuře:
  #   • publikuje na 127.0.0.1:3100 (nginx tam už míří)
  #   • připojí se k síti `jede_default` jako external a sahá na hosta `db`
  #   • databáze `cvms` je předpřipravená v initdb/01-databases.sql

volumes:
  pgdata:
