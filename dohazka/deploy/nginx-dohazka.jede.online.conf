# dohazka.jede.online -> kontejner dohazka na 127.0.0.1:3600
# Certifikat: certbot certonly --webroot -w /opt/jede/dohazka-acme -d dohazka.jede.online

server {
    listen 80;
    listen [::]:80;
    server_name dohazka.jede.online;
    location /.well-known/acme-challenge/ { root /opt/jede/dohazka-acme; }
    location / { return 301 https://dohazka.jede.online$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dohazka.jede.online;
    ssl_certificate /etc/letsencrypt/live/dohazka.jede.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dohazka.jede.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Soukroma aplikace za prihlasenim. Bezpecnostni hlavicky.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Odkaz na pozvanku i na obnovu hesla nese jednorazovy TOKEN V CESTE. Access log zapisuje
    # cestu cela, takze by se tajemstvi ulozilo na disk (a do rotaci logu) citelne. `^~` ma
    # prednost pred regexovymi locationy. proxy_pass musi byt i tady: location se nededi,
    # bez nej by cesta skoncila 404. Pri uprave vhostu oba bloky drz shodne.
    location ^~ /pozvanka/ {
        access_log off;
        proxy_pass http://127.0.0.1:3600;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # POVINNE: Next 15 porovnava u serverovych akci Origin s x-forwarded-host ?? host. Bez tohoto
        # radku projde dal hodnota od klienta a kontrola by stala na tom, co si posle sam.
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3600;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # POVINNE: Next 15 porovnava u serverovych akci Origin s x-forwarded-host ?? host. Bez tohoto
        # radku projde dal hodnota od klienta a kontrola by stala na tom, co si posle sam.
        proxy_set_header X-Forwarded-Host $host;
        # POVINNE: src/lib/ip.ts cte JEN x-real-ip. Bez nej sdili vsechna prihlaseni
        # jeden limit (10 / 15 min) a zablokuje se cely internet naraz.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
