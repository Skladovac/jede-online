# dohazka.jede.online — vlastní compose projekt na Hetzner CX23 (178.104.231.220).
#
# Připojuje se ke sdílené síti `jede_default` (postgres `db` ze stacku landingu)
# a používá vlastní databázi `dohazka` s vlastním uživatelem.
# Spouští se vždy přes deploy-dohazka.sh, který doplní --env-file.
#
# Pojistka 8: proměnná, která tu není VYPSANÁ, do kontejneru NEDOJDE.

name: dohazka

services:
  dohazka:
    build:
      context: ..            # složka dohazka/ (tam je Dockerfile)
      target: runner
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Dny a hodiny výkazu i večerní okno připomínky počítáme v českém čase.
      TZ: Europe/Prague
      DATABASE_URL: ${DOHAZKA_DATABASE_URL:?chybi DOHAZKA_DATABASE_URL v env souboru}
      CRON_SECRET: ${CRON_SECRET:?chybi CRON_SECRET v env souboru}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      APP_URL: ${APP_URL:-}
      # Prázdné = použije se výchozí cesta k DejaVu fontu z Dockerfilu.
      DOHAZKA_PDF_FONT: ${DOHAZKA_PDF_FONT:-}
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
    ports:
      - "127.0.0.1:3600:3000"
    networks: [jede]

  # Migrační brána (pojistka 3) a `npm run user:add`. Stage `builder` má prisma CLI,
  # tsx, migrace i scripts/.
  dohazka-migrate:
    build:
      context: ..
      target: builder
    profiles: ["tools"]
    environment:
      TZ: Europe/Prague
      DATABASE_URL: ${DOHAZKA_DATABASE_URL:?chybi DOHAZKA_DATABASE_URL v env souboru}
    command: ["npx", "prisma", "migrate", "status"]
    networks: [jede]

networks:
  jede:
    external: true
    name: jede_default
