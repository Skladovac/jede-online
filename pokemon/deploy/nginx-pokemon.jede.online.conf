# pokemon.jede.online -> kontejner pokemon na 127.0.0.1:3400
# Certifikat: certbot certonly --webroot -w /opt/jede/pokemon-acme -d pokemon.jede.online
server {
    listen 80;
    listen [::]:80;
    server_name pokemon.jede.online;
    location /.well-known/acme-challenge/ { root /opt/jede/pokemon-acme; }
    location / { return 301 https://pokemon.jede.online$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pokemon.jede.online;
    ssl_certificate /etc/letsencrypt/live/pokemon.jede.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pokemon.jede.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Uzavrena beta, nic neindexovat.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:3400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
