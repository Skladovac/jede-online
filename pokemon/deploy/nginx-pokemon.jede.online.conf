# pokemon.jede.online -> kontejner pokemon na 127.0.0.1:3400
# Certifikat: certbot certonly --webroot -w /opt/jede/pokemon-acme -d pokemon.jede.online

# Kes obrazku karet z CDN TCGdex (jejich CDN obcas vypadne; obrazky se nemeni).
# Max 3 GB na disku, nepouzite 60 dni se smazou.
proxy_cache_path /var/cache/nginx/pokemon-img levels=1:2 keys_zone=pokemon_img:20m max_size=3g inactive=60d use_temp_path=off;

server {
    listen 80;
    listen [::]:80;
    server_name pokemon.jede.online;
    location /.well-known/acme-challenge/ { root /opt/jede/pokemon-acme; }
    location / { return 301 https://pokemon.jede.online$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pokemon.jede.online;
    ssl_certificate /etc/letsencrypt/live/pokemon.jede.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pokemon.jede.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Uzavrena beta, nic neindexovat.
    add_header X-Robots-Tag "noindex, nofollow" always;
    # Bezpecnostni hlavicky (pozor: add_header v location rusi tyto - u /img* jsou proto zopakovane).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /img/ {
        proxy_pass https://assets.tcgdex.net/;
        proxy_ssl_server_name on;
        proxy_set_header Host assets.tcgdex.net;
        proxy_cache pokemon_img;
        proxy_cache_valid 200 60d;
        proxy_cache_valid 404 1d;
        # Pri vypadku CDN servirovat i starsi kopii.
        proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        add_header X-Cache $upstream_cache_status always;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        # Cizi obsah z nasi domeny: jen jako obrazek, nikdy jako stranka se skriptem.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "sandbox; default-src 'none'; style-src 'unsafe-inline'" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Doplnene obrazky z pokemontcg.io (kde TCGdex obrazek nema).
    location /img2/ {
        proxy_pass https://images.pokemontcg.io/;
        proxy_ssl_server_name on;
        proxy_set_header Host images.pokemontcg.io;
        proxy_cache pokemon_img;
        proxy_cache_valid 200 60d;
        proxy_cache_valid 404 1d;
        # Pri vypadku CDN servirovat i starsi kopii.
        proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        add_header X-Cache $upstream_cache_status always;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        # Cizi obsah z nasi domeny: jen jako obrazek, nikdy jako stranka se skriptem.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "sandbox; default-src 'none'; style-src 'unsafe-inline'" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Obrazky zapecetenych produktu (TCGplayer).
    location /img3/ {
        proxy_pass https://tcgplayer-cdn.tcgplayer.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host tcgplayer-cdn.tcgplayer.com;
        proxy_cache pokemon_img;
        proxy_cache_valid 200 60d;
        proxy_cache_valid 404 1d;
        # Pri vypadku CDN servirovat i starsi kopii.
        proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        add_header X-Cache $upstream_cache_status always;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        # Cizi obsah z nasi domeny: jen jako obrazek, nikdy jako stranka se skriptem.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "sandbox; default-src 'none'; style-src 'unsafe-inline'" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
