# vasirm.jede.online -> kontejner vasirm na 127.0.0.1:3500
# Certifikat: certbot certonly --webroot -w /opt/jede/vasirm-acme -d vasirm.jede.online
# Po presunu na vasirm.cz: viz vasirm/README.md (novy server blok + 301 z vasirm.jede.online).

server {
    listen 80;
    listen [::]:80;
    server_name vasirm.jede.online;
    location /.well-known/acme-challenge/ { root /opt/jede/vasirm-acme; }
    location / { return 301 https://vasirm.jede.online$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name vasirm.jede.online;
    ssl_certificate /etc/letsencrypt/live/vasirm.jede.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vasirm.jede.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Bezpecnostni hlavicky (pozor: add_header v location rusi tyto - u /media je proto zopakovane).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Nahrane fotky a videa primo z disku (nazvy jsou unikatni -> kes natrvalo). Range pro video umi nginx sam.
    location /media/ {
        alias /opt/jede/vasirm-media/;
        types { image/webp webp; video/mp4 mp4; image/jpeg jpg; image/png png; }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "sandbox; default-src 'none'; style-src 'unsafe-inline'" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Nahravani fotek a videa z administrace: velke telo, bez bufferovani na disk nginxu.
    location = /api/admin/upload {
        client_max_body_size 650m;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_pass http://127.0.0.1:3500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Export z Realmanu: JSON jedne nabidky (fotky jako odkazy). IP Realmanu kontroluje aplikace (X-Real-IP).
    location ^~ /import/ {
        client_max_body_size 10m;
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:3500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        client_max_body_size 2m;
        proxy_pass http://127.0.0.1:3500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
