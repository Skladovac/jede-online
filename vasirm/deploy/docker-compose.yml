# vasirm.jede.online — vlastní compose projekt na Hetzner CX23 (178.104.231.220).
#
# Připojuje se ke sdílené síti `jede_default` (postgres `db` ze stacku landingu)
# a používá vlastní databázi `vasirm` s vlastním uživatelem.
# Spouští se vždy přes deploy-vasirm.sh, který doplní --env-file.
#
# Pojistka: proměnná, která tu není VYPSANÁ, do kontejneru NEDOJDE.

name: vasirm

services:
  vasirm:
    build:
      context: ..            # složka vasirm/ (tam je Dockerfile)
      target: runner
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TZ: Europe/Prague
      DATABASE_URL: ${VASIRM_DATABASE_URL}
      SITE_URL: ${SITE_URL}
      ALLOW_INDEXING: ${ALLOW_INDEXING:-0}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      LEAD_EMAILS: ${LEAD_EMAILS:-}
      # Správce webu (vyplněný dotazník makléřů apod.)
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      # Export z Realmanu (/import/estate/{ID}); požadavky jen z IP Realmanu 88.86.117.161–173.
      REALMAN_API_KEY: ${REALMAN_API_KEY:-}
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
    volumes:
      # Nahrané fotky a videa. Stejnou složku čte nginx přímo (location /media/).
      - /opt/jede/vasirm-media:/app/media
    ports:
      - "127.0.0.1:3500:3000"
    networks: [jede]

  # Migrace, import ze starého webu a správa účtů. Stage `builder` má prisma CLI, tsx i scripts/.
  # Běží pod stejným uživatelem (1001) jako web, ať soubory v media/ patří jemu.
  vasirm-tools:
    build:
      context: ..
      target: builder
    profiles: ["tools"]
    user: "1001:1001"
    environment:
      HOME: /tmp
      DATABASE_URL: ${VASIRM_DATABASE_URL}
      MEDIA_DIR: /app/media
      CREDENTIALS_FILE: /creds/ucty.txt
      # Pro scripts/email-test.ts (zkušební e-mail o poptávce).
      SITE_URL: ${SITE_URL}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      LEAD_EMAILS: ${LEAD_EMAILS:-}
    volumes:
      - /opt/jede/vasirm-media:/app/media
      - /opt/jede/vasirm-creds:/creds
    command: ["npx", "prisma", "migrate", "status"]
    networks: [jede]

networks:
  jede:
    external: true
    name: jede_default
